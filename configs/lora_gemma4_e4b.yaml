# mlx_lm.lora — Gemma 4 E4B（dense）本機 LoRA 微調主線
#
# ⚠️ 為什麼是 E4B 不是 12B：
#    Gemma 4 12B Unified 的 model_type 是 `gemma4_unified`，mlx-lm 0.31.3 不支援
#    （ValueError: Model type gemma4_unified not supported，issue #1481 還開著）。
#    E4B / 26B-A4B / 31B 用的是 `gemma4`，都能跑。
#
# 跑法：
#   source .venv/bin/activate
#   mlx_lm.lora --config configs/lora_gemma4_e4b.yaml
#
# 恢復訓練（中斷後）：
#   mlx_lm.lora --config configs/lora_gemma4_e4b.yaml \
#               --resume-adapter-file out/lora-e4b/adapters.safetensors
#
# 訓練完融合成完整權重（評測與比較要用）：
#   mlx_lm.fuse --model mlx-community/gemma-4-e4b-it-4bit \
#               --adapter-path out/lora-e4b \
#               --save-path out/gemma4-e4b-tw
#
# ⚠️ 記憶體預算（predict_memory_gemma.py --model gemma4-e4b --seq 2048 --bs 1）
#     4-bit 權重 3.7 + LoRA 0.14 + 活化(ckpt) 0.63 + logits 3.00 + 開銷 1.0 = 8.5 GiB ✅
#
#     E4B 在 24GB 上很寬裕，消融空間比原本的 12B 大得多：
#
#       seq   bs  ckpt  精度   活化   logits   合計
#        512   1   on   4bit   0.16    0.75    5.7 GiB  ✅
#       2048   1   on   4bit   0.63    3.00    8.5 GiB  ✅ ← 本檔預設
#       2048   1   off  4bit   8.34    3.00   16.2 GiB  ⚠️ 要調高 wired limit
#       4096   1   on   4bit   1.25    6.00   12.1 GiB  ✅
#        512   8   on   4bit   1.28    6.00   12.1 GiB  ✅
#       2048   1   on   bf16   0.63    3.00   18.7 GiB  ⚠️ 要調高 wired limit
#
#     **最後一列是這次換模型最大的收穫**：bf16 LoRA 在本機跑得起來，
#     所以 P1 / P4（bf16 vs 4-bit 的記憶體與掉點）不必租卡就能做。
#     bf16 版權重：mlx-community/gemma-4-e4b-it-bf16

model: "mlx-community/gemma-4-e4b-it-4bit"
train: true

# prepare_data_gemma.py 的輸出目錄（裡面要有 train.jsonl 與 valid.jsonl）
data: "data/mlx"

seed: 42

# LoRA 掛在最上面幾層。-1 = 全部 42 層。
# 可訓練參數（attention only, r=16）：4 層≈0.9M / 16 層≈3.5M / 42 層≈9.1M
# 先用 16 跑通、量 baseline；消融時再掃 4 / 16 / -1（run_ablation.py --suite lora）。
num_layers: 16

# E4B 夠小，bs=2 也放得下（seq2048 約 12.1 GiB）。
# 先用 1 對齊 26B 的條件，確認流程後可以往上調。
batch_size: 1
iters: 1000

# max_seq_length 必須用 prepare_data_gemma.py 算出的建議值填。
# Gemma 的 tokenizer 是 262K vocab，token 長度分布要重新量，不要沿用 Week 1 的 2048。
max_seq_length: 2048

learning_rate: 1e-4
lr_schedule:
  name: cosine_decay
  warmup: 50
  warmup_init: 1e-6
  arguments: [1e-4, 1000, 1e-6]      # [峰值, 總步數, 最終值]

steps_per_report: 10
steps_per_eval: 100
val_batches: 25
save_every: 200

adapter_path: "out/lora-e4b"
resume_adapter_file: null

test: false
test_batches: 100

# 梯度檢查點：E4B 不開也跑得動（16.2 GiB，調高 wired limit 即可），
# 所以 H3 可以在**正式訓練的同一個 seq** 上量開關差異，比原本的 12B 乾淨。
# 正式訓練仍建議開著（8.5 GiB，留餘裕給評測 server 同時開）。
grad_checkpoint: true

lora_parameters:
  # attention only。掛滿 42 層時 9.1M 可訓練參數（0.135 GiB 優化器狀態）。
  # 消融時改成含 FFN：加上 "mlp.gate_proj", "mlp.up_proj", "mlp.down_proj"
  # → 34.9M 可訓練參數，優化器記憶體 0.14 → 0.52 GiB（膨脹 3.8×）。
  # 對照：26B MoE 掛到 expert 上是 11.5M → 667.4M（膨脹 58×）—— 這就是 H6 的重點。
  #
  # ⚠️ E4B 的後 18 層（num_kv_shared_layers=18）共用前面算好的 K/V，
  #    這些層根本沒有 k_proj / v_proj 模組。
  #    mlx-lm 對找不到的 key 是直接略過（tuner/utils.py），不會報錯，
  #    所以照列是安全的 —— k/v 的 adapter 只會作用在前 24 層。
  keys:
    - "self_attn.q_proj"
    - "self_attn.k_proj"
    - "self_attn.v_proj"
    - "self_attn.o_proj"
  rank: 16
  scale: 20.0
  dropout: 0.0
